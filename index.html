<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>GardenStar</title>
<meta name="description" content="The farm game that grows your real garden: map your actual yard in pixel art, plant real natives, and earn XP for real gardening.">
<meta property="og:title" content="GardenStar: the farm game that grows your real garden">
<meta property="og:description" content="Map your real yard, plant real natives, get real watering and frost advice, and level up for doing it.">
<meta name="theme-color" content="#4a2f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="hud">
    <button class="hud-level" id="hud-level" aria-label="Your level and badges">
      <span class="lv-badge" id="lv-num">1</span>
      <span class="lv-meta">
        <span class="lv-title" id="lv-title">Seedling</span>
        <span class="xpbar"><span class="xpfill" id="xp-fill"></span></span>
      </span>
    </button>
    <div class="hud-streak" id="hud-streak" title="Daily check-in streak">
      <i class="ico" data-icon="flame"></i><b id="streak-num">0</b>
    </div>
    <button class="hud-weather" id="hud-weather" aria-label="Weather">
      <i class="ico" data-icon="partsun" id="wx-icon"></i><b id="wx-temp">--°</b>
    </button>
  </header>

  <main id="stage">
    <canvas id="yard" role="img" aria-label="Pixel map of your yard"></canvas>
    <div class="map-ctrls">
      <button class="mapbtn" id="z-in" aria-label="Zoom in">+</button>
      <button class="mapbtn" id="z-out" aria-label="Zoom out">&minus;</button>
      <button class="mapbtn small" id="z-fit" aria-label="Show the whole yard">FIT</button>
      <button class="mapbtn" id="shade-toggle" aria-label="Show tree shade" aria-pressed="false"><i class="ico" data-icon="shade"></i></button>
      <button class="mapbtn" id="undo" aria-label="Undo last change" disabled><i class="ico" data-icon="undo"></i></button>
      <button class="mapbtn" id="compass" aria-label="Compass"><span class="needle">N</span></button>
    </div>
    <div class="palette hidden" id="palette" role="toolbar" aria-label="Build tools">
      <button id="pal-undo" disabled><span class="sw sw-undo"><i class="ico" data-icon="undo"></i></span>Undo</button>
      <button id="pal-house"><span class="sw sw-home"><i class="ico" data-icon="garden"></i></span>My house</button>
      <button data-terrain="move"><span class="sw sw-move"></span>Move</button>
      <button id="pal-box" aria-pressed="false"><span class="sw sw-box"></span>Box</button>
      <button data-terrain="grass"><span class="sw sw-grass"></span>Lawn</button>
      <button data-terrain="soil" class="active"><span class="sw sw-soil"></span>Bed</button>
      <button data-terrain="path"><span class="sw sw-path"></span>Path</button>
      <button data-terrain="driveway"><span class="sw sw-drive"></span>Drive</button>
      <button data-terrain="fence"><span class="sw sw-fence"></span>Fence</button>
      <button data-terrain="house"><span class="sw sw-house"></span>House</button>
      <button data-terrain="offlot"><span class="sw sw-offlot"></span>Not mine</button>
      <button data-terrain="dig"><span class="sw sw-dig"></span>Dig up</button>
    </div>
    <div class="mode-chip hidden" id="mode-chip"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </main>

  <nav class="toolbar" id="toolbar" aria-label="Tools">
    <button data-tool="look" class="active"><i class="ico" data-icon="look"></i><span>Look</span></button>
    <button data-tool="plant"><i class="ico" data-icon="plant"></i><span>Plant</span></button>
    <button data-tool="water"><i class="ico" data-icon="water"></i><span>Water</span></button>
    <button data-tool="build"><i class="ico" data-icon="build"></i><span>Build</span></button>
    <button data-open="todos"><i class="ico" data-icon="scroll"></i><span>To-dos</span><b class="count hidden" id="quest-count">0</b></button>
    <button data-open="garden"><i class="ico" data-icon="garden"></i><span>Garden</span></button>
  </nav>

  <section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheet-title">
    <div class="sheet-grip" id="sheet-grip" aria-label="Resize panel"><span></span></div>
    <header class="sheet-head">
      <h2 id="sheet-title">&nbsp;</h2>
      <button class="sheet-close" id="sheet-close" aria-label="Close panel">&times;</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="dialog hidden" id="dialog" role="dialog" aria-modal="true"><div class="dialog-box" id="dialog-box"></div></div>
  <div class="banner hidden" id="banner" aria-live="polite"></div>
  <div class="welcome hidden" id="welcome"></div>
</div>

<script src="js/config.js"></script>
<script src="js/plants.js"></script>
<script src="js/art.js"></script>
<script src="js/sprites.js"></script>
<script src="js/grid.js"></script>
<script src="js/sun.js"></script>
<script src="js/weather.js"></script>
<script src="js/care.js"></script>
<script src="js/game.js"></script>
<script src="js/importer.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
</body>
</html>
